name: Deploy Attested Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-edge-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: odbjjklumdsuqdvkgwyv
  GENERATED_MANIFEST: supabase/functions/_shared/edgeBuildManifest.generated.ts

jobs:
  deploy:
    name: Deploy four bundles from one commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v5
        with:
          ref: refs/heads/main
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Prove clean detached source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            printf 'Production deploys must be dispatched from main.\n' >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'GITHUB_SHA is not a full lowercase Git SHA.\n' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            printf 'Checked-out HEAD does not equal GITHUB_SHA.\n' >&2
            exit 1
          fi
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            printf 'GITHUB_SHA is not the fetched main head.\n' >&2
            exit 1
          fi

          git checkout --detach "$GITHUB_SHA"
          if git symbolic-ref -q HEAD >/dev/null; then
            printf 'Deployment checkout is not detached.\n' >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            printf 'Deployment checkout is not clean.\n' >&2
            exit 1
          fi
          if git ls-files --error-unmatch "$GENERATED_MANIFEST" \
            >/dev/null 2>&1; then
            printf 'Generated edge manifest must never be tracked.\n' >&2
            exit 1
          fi
          git check-ignore -q "$GENERATED_MANIFEST"
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Install and generate immutable bundle metadata
        run: |
          set -euo pipefail
          npm ci
          npm run edge:manifest
          npm run edge:manifest -- --check
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            printf 'Tracked checkout changed during manifest generation.\n' >&2
            exit 1
          fi

      - name: Validate exact deploy tree
        env:
          VITE_SUPABASE_PROJECT_ID: odbjjklumdsuqdvkgwyv
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npm run edge:mcp-attestation:test
          npm run edge:runtime-attestation:test
          npm run build
          npm run edge:mcp-attestation:check
          grep -q 'var projectRef = "odbjjklumdsuqdvkgwyv"' \
            supabase/functions/mcp/index.ts
          git diff --exit-code
          git diff --cached --exit-code
          deno check --no-lock \
            supabase/functions/strategy-chat/index.ts \
            supabase/functions/analyze-call/index.ts \
            supabase/functions/version/index.ts
          deno test --no-lock \
            supabase/functions/_shared/edgeBuildAttestation_test.ts \
            supabase/functions/version/index_test.ts

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.109.1

      - name: Seal exact deploy tree after all repository-controlled steps
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          if git symbolic-ref -q HEAD >/dev/null; then
            printf 'Deployment checkout is no longer detached.\n' >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]] || \
            [[ "$SOURCE_SHA" != "$GITHUB_SHA" ]] || \
            [[ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]]; then
            printf 'Deployment source changed after initial validation.\n' >&2
            exit 1
          fi
          if git ls-files --error-unmatch "$GENERATED_MANIFEST" \
            >/dev/null 2>&1; then
            printf 'Generated edge manifest became tracked.\n' >&2
            exit 1
          fi
          git check-ignore -q "$GENERATED_MANIFEST"
          npm run edge:manifest -- --check
          npm run edge:mcp-attestation:check
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const source = readFileSync(process.env.GENERATED_MANIFEST, "utf8");
          const match = source.match(
            /export const EDGE_BUILD_MANIFEST = (\{[\s\S]*\}) as const;\n$/,
          );
          if (!match) throw new Error("Generated manifest has an unexpected shape");
          const manifest = JSON.parse(match[1]);
          const sha = process.env.GITHUB_SHA;
          const names = ["strategy-chat", "analyze-call", "mcp", "version"];
          if (manifest.source_commit !== sha) throw new Error("Manifest SHA mismatch");
          if (!/^edge-[0-9]{8}-[0-9a-f]{12}$/.test(manifest.release_id)) {
            throw new Error("Manifest release ID is malformed");
          }
          if (manifest.release_id.slice(-12) !== sha.slice(0, 12)) {
            throw new Error("Manifest release ID is not bound to GITHUB_SHA");
          }
          const actualNames = Object.keys(manifest.functions ?? {}).sort();
          if (JSON.stringify(actualNames) !== JSON.stringify([...names].sort())) {
            throw new Error("Manifest does not contain the exact function set");
          }
          if (names.some((name) => manifest.functions[name] !== sha)) {
            throw new Error("Not every manifest function maps to GITHUB_SHA");
          }
          NODE
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            printf 'Deployment checkout changed after final sealing.\n' >&2
            exit 1
          fi

      - name: Stage and activate exactly four functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            printf 'SUPABASE_ACCESS_TOKEN is not configured.\n' >&2
            exit 1
          fi
          supabase functions deploy \
            strategy-chat analyze-call mcp version \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --use-api \
            --jobs 1

  verify:
    name: Verify every deployed bundle
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SOURCE_COMMIT: ${{ needs.deploy.outputs.source_sha }}
      SUPABASE_PROJECT_REF: odbjjklumdsuqdvkgwyv
    steps:
      - name: Check out the deployed source verifier
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.deploy.outputs.source_sha }}
          clean: true
          persist-credentials: false

      - name: Prove verifier source matches the deployed commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SOURCE_COMMIT" ]]; then
            printf 'Verifier checkout does not match the deployed source.\n' >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            printf 'Verifier checkout is not clean.\n' >&2
            exit 1
          fi

      - name: Verify four independent runtime attestations
        shell: bash
        run: bash scripts/verify-edge-attestations.sh
