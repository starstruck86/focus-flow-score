name: CI
on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify repository security contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/security/scan-tracked-schema-secrets.py")
          compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          python3 -m unittest discover -s tests/security -p 'test_*.py' -v
          python3 scripts/security/scan-tracked-schema-secrets.py
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2
      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 17
          database: migration_verify_ci
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify migration rehearsal tooling
        run: |
          for launcher in \
            scripts/migration/run-lovable-toc-capture.sh \
            scripts/migration/run-lovable-toc-annotation-authoring.sh \
            scripts/migration/run-lovable-toc-ledger-validation.sh
          do
            sh -n "$launcher"
          done
          for script in \
            scripts/migration/inspect-lovable-dump.sh \
            scripts/migration/tests/catalog-verification.test.sh \
            scripts/migration/tests/inspect-lovable-dump.integration.sh \
            scripts/migration/tests/inspect-lovable-export.integration.sh \
            scripts/migration/tests/inspect-lovable-dump.test.sh \
            scripts/migration/tests/lib/postgres-test-safety.sh \
            scripts/migration/tests/postgres-cross-major-compatibility.integration.sh \
            scripts/migration/tests/postgres-target-safety.test.sh \
            scripts/migration/tests/service-verification.test.sh \
            scripts/security/tests/cron-attempt-receipts.integration.sh \
            scripts/security/tests/cron-attempt-receipts-target-safety.test.sh
          do
            bash -n "$script"
          done
          python3 - <<'PY'
          from pathlib import Path

          for path in (
              Path("scripts/migration/compare-manifests.py"),
              Path("scripts/migration/catalog-jsonl-to-manifest.py"),
              Path("scripts/migration/inventory-edge-functions.py"),
              Path("scripts/migration/bounded-pg-restore.py"),
              Path("scripts/migration/author-lovable-toc-annotations.py"),
              Path("scripts/migration/capture-lovable-toc-envelope.py"),
              Path("scripts/migration/capture-lovable-toc.py"),
              Path("scripts/migration/inspect-lovable-export.py"),
              Path("scripts/migration/normalize-lovable-export.py"),
              Path("scripts/migration/lib/lovable_dump_report.py"),
              Path("scripts/migration/lib/lovable_toc_authoring_contract.py"),
              Path("scripts/migration/lib/lovable_toc_contract.py"),
              Path("scripts/migration/validate-postgres-image-lock.py"),
              Path("scripts/migration/validate-lovable-toc-ledger.py"),
          ):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_toc_annotation_*.py' -v
          python3 -I -S -B -m unittest discover -s tests/migration -p 'test_*.py' -v
          python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_toc_capture_driver.py' -v
          bash scripts/migration/tests/inspect-lovable-dump.test.sh
          bash scripts/migration/tests/postgres-target-safety.test.sh
          bash scripts/migration/tests/catalog-verification.test.sh
          bash scripts/migration/tests/service-verification.test.sh
          bash scripts/security/tests/cron-attempt-receipts-target-safety.test.sh
          bash scripts/security/tests/cron-attempt-receipts.integration.sh
          bash scripts/migration/tests/inspect-lovable-dump.integration.sh
          bash scripts/migration/tests/inspect-lovable-export.integration.sh
          git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
        env:
          PGDATABASE: migration_verify_ci
          PGHOST: /var/run/postgresql
          PGUSER: runner
          MIGRATION_VERIFY_ALLOW_FIXTURE: "1"
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - run: >-
          deno check --no-lock
          supabase/functions/strategy-chat/index.ts
          supabase/functions/analyze-call/index.ts
          supabase/functions/version/index.ts
          supabase/functions/daily-digest/index.ts
          supabase/functions/run-strategy-task-reaper/index.ts
          supabase/functions/run-strategy-task-reaper-receipt-v1/index.ts
          supabase/functions/schedule-daily-plan/index.ts
          supabase/functions/_shared/cronSecretAuth.ts
          supabase/functions/_shared/cronHeadReceiver.ts
          supabase/functions/_shared/cronAttemptReceipt.ts
          supabase/functions/daily-digest/handler.ts
          supabase/functions/run-strategy-task-reaper/handler.ts
          supabase/functions/run-strategy-task-reaper-receipt-v1/handler.ts
          supabase/functions/schedule-daily-plan/handler.ts
          scripts/security/verify-cron-attempt-receipt.ts
          scripts/security/verify-cron-secret-rotation.ts
      - run: >-
          deno test --no-lock
          supabase/functions/_shared/strategy-router/situationClassifier_test.ts
          supabase/functions/_shared/strategy-core/situationIntelligenceRetrieval_test.ts
          supabase/functions/version/index_test.ts
          supabase/functions/_shared/cronSecretAuth_test.ts
          supabase/functions/_shared/cronHeadReceiver_test.ts
          supabase/functions/_shared/cronAttemptReceipt_test.ts
          supabase/functions/run-strategy-task-reaper/handler_test.ts
          supabase/functions/run-strategy-task-reaper-receipt-v1/handler_test.ts
          scripts/security/verify-cron-attempt-receipt_test.ts
          scripts/security/verify-cron-secret-rotation_test.ts
      - run: npm audit --omit=dev --audit-level=high

  migration-envelope-macos:
    name: macOS ZIP-envelope workflow
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Exercise macOS inspection diagnostics and durable publication
        env:
          PATH: /usr/bin:/bin
        run: |
          for launcher in \
            scripts/migration/run-lovable-toc-capture.sh \
            scripts/migration/run-lovable-toc-annotation-authoring.sh \
            scripts/migration/run-lovable-toc-ledger-validation.sh
          do
            sh -n "$launcher"
          done
          for script in \
            scripts/migration/inspect-lovable-dump.sh \
            scripts/migration/tests/inspect-lovable-dump.test.sh
          do
            bash -n "$script"
          done
          /usr/bin/python3 -I -S -B - <<'PY'
          import os
          import stat
          import sys
          from pathlib import Path

          executable = Path(sys.executable).resolve(strict=True)
          metadata = executable.lstat()
          mode = stat.S_IMODE(metadata.st_mode)
          if not (
              executable.is_absolute()
              and stat.S_ISREG(metadata.st_mode)
              and metadata.st_nlink == 1
              and metadata.st_uid in {0, os.geteuid()}
              and mode & 0o7022 == 0
              and mode & 0o100 != 0
              and sys.flags.isolated == 1
              and sys.flags.ignore_environment == 1
              and sys.flags.no_user_site == 1
              and sys.flags.no_site == 1
              and sys.flags.dont_write_bytecode == 1
              and sys.dont_write_bytecode is True
          ):
              raise SystemExit(1)

          for path in (
              Path("scripts/migration/author-lovable-toc-annotations.py"),
              Path("scripts/migration/bounded-pg-restore.py"),
              Path("scripts/migration/capture-lovable-toc-envelope.py"),
              Path("scripts/migration/capture-lovable-toc.py"),
              Path("scripts/migration/inspect-lovable-export.py"),
              Path("scripts/migration/normalize-lovable-export.py"),
              Path("scripts/migration/lib/lovable_dump_report.py"),
              Path("scripts/migration/lib/lovable_toc_authoring_contract.py"),
              Path("scripts/migration/lib/lovable_toc_contract.py"),
              Path("scripts/migration/validate-lovable-toc-ledger.py"),
          ):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_toc_annotation_*.py' -v
          bash scripts/migration/tests/inspect-lovable-dump.test.sh
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_dump_report.py' -v
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_zip_normalizer.py' -v
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_bounded_pg_restore.py' -v
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_export_evidence_workflow.py' -v
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_toc_contract.py' -v
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_toc_tools.py' -v
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_toc_capture_driver.py' -v
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_toc_capture_startup.py' -v
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_toc_preimport_guard.py' -v
          /usr/bin/python3 -I -S -B -m unittest discover \
            -s tests/migration -p 'test_lovable_toc_diagnostic_writer.py' -v

  postgres-cross-major-compatibility:
    name: PostgreSQL 17.6/18.4 synthetic compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Verify pinned cross-major fixture syntax and identities
        run: |
          bash -n scripts/migration/tests/postgres-cross-major-compatibility.integration.sh
          python3 -m unittest tests.migration.test_postgres_cross_major_contract -v
          python3 -I scripts/migration/validate-postgres-image-lock.py \
            scripts/migration/tests/postgres-cross-major-images.lock.json
      - name: Run isolated PostgreSQL cross-major fixture
        run: bash scripts/migration/tests/postgres-cross-major-compatibility.integration.sh
