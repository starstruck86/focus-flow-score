name: Verify Production Version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify production version attestation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main release metadata
        uses: actions/checkout@v5
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify deployed version
        shell: bash
        env:
          RELEASE_FILE: supabase/functions/_shared/release.json
          VERSION_URL: https://odbjjklumdsuqdvkgwyv.supabase.co/functions/v1/version
        run: |
          set -euo pipefail

          if ! jq -e '
            type == "object"
            and (.release_id
              | type == "string"
              and test("^edge-[0-9]{8}-[0-9a-f]{12}$"))
            and (.source_commit
              | type == "string"
              and test("^[0-9a-f]{40}$"))
          ' "$RELEASE_FILE" >/dev/null; then
            printf 'Invalid release metadata in %s on main.\n' "$RELEASE_FILE" >&2
            exit 1
          fi

          expected_release_id="$(jq -er '.release_id' "$RELEASE_FILE")"
          expected_source_commit="$(jq -er '.source_commit' "$RELEASE_FILE")"

          release_suffix="${expected_release_id##*-}"
          source_prefix="${expected_source_commit:0:12}"
          if [[ "$release_suffix" != "$source_prefix" ]]; then
            printf 'Release ID suffix does not match source commit prefix.\n' >&2
            exit 1
          fi

          if ! git cat-file -e "${expected_source_commit}^{commit}" 2>/dev/null; then
            printf 'Source commit does not resolve to a Git commit: %s\n' \
              "$expected_source_commit" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$expected_source_commit" HEAD; then
            printf 'Source commit is not an ancestor of checked-out main: %s\n' \
              "$expected_source_commit" >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_status="$(
            curl --silent --show-error \
              --proto '=https' \
              --tlsv1.2 \
              --connect-timeout 10 \
              --max-time 30 \
              --request GET \
              --header 'Accept: application/json' \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$VERSION_URL"
          )"

          if [[ "$http_status" != "200" ]]; then
            printf 'Version endpoint returned HTTP %s; expected 200.\n' "$http_status" >&2
            exit 1
          fi

          if ! jq -e 'type == "object"' "$response_file" >/dev/null; then
            printf 'Version endpoint did not return a JSON object.\n' >&2
            exit 1
          fi

          if ! jq -e \
            --arg release_id "$expected_release_id" \
            --arg source_commit "$expected_source_commit" '
              .status == "ok"
              and .service == "version"
              and .verified == true
              and .release_id == $release_id
              and .source_commit == $source_commit
              and (.deployment_id
                | type == "string"
                and startswith("odbjjklumdsuqdvkgwyv_"))
              and has("region")
              and .proof_scope == "version-function-bundle"
            ' "$response_file" >/dev/null; then
            printf 'Production version attestation did not match main.\n' >&2
            printf 'Expected release_id=%s source_commit=%s\n' \
              "$expected_release_id" "$expected_source_commit" >&2
            printf 'Received non-sensitive fields: ' >&2
            jq -c \
              '{status, service, release_id, source_commit, deployment_id, region, proof_scope, verified}' \
              "$response_file" >&2
            exit 1
          fi

          printf 'Verified production version evidence from main (%s):\n' "$(git rev-parse HEAD)"
          jq -c \
            '{status, service, release_id, source_commit, deployment_id, region, proof_scope, verified}' \
            "$response_file"
